  <script>
    function asyncResolve(val) {
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(val);
        }, 0);
      });
    }

    const mockPlayer = {
      isAuthorized: function () { return true; },
      getName: function () { return "Player"; },
      getPhoto: function () { return ""; },
      getUniqueID: function () { return "local_player"; },
      signature: "mock_signature",
      getSignature: function () { return asyncResolve("mock_signature"); },
      getData: function () {
        try {
          let saved = localStorage.getItem("surf_go_data");
          let obj = saved ? JSON.parse(saved) : {};
          return asyncResolve(obj);
        } catch (e) {
          return asyncResolve({});
        }
      },
      setData: function (data) {
        try {
          let current = localStorage.getItem("surf_go_data");
          let obj = current ? JSON.parse(current) : {};
          Object.assign(obj, data || {});
          localStorage.setItem("surf_go_data", JSON.stringify(obj));
        } catch (e) { }
        return asyncResolve();
      },
      getStats: function () {
        try {
          let saved = localStorage.getItem("surf_go_stats");
          let obj = saved ? JSON.parse(saved) : {};
          return asyncResolve(obj);
        } catch (e) {
          return asyncResolve({});
        }
      },
      setStats: function (stats) {
        try {
          let current = localStorage.getItem("surf_go_stats");
          let obj = current ? JSON.parse(current) : {};
          Object.assign(obj, stats || {});
          localStorage.setItem("surf_go_stats", JSON.stringify(obj));
        } catch (e) { }
        return asyncResolve();
      }
    };

    window.player = mockPlayer;

    const mockPayments = {
      getCatalog: function () { return asyncResolve([]); },
      getPurchases: function () { return asyncResolve([]); },
      consumePurchase: function () { return asyncResolve(); },
      purchase: function () { return asyncResolve(); }
    };
    window.payments = mockPayments;

    const mockLeaderboard = {
      getLeaderboardPlayerEntry: function () { return asyncResolve({}); },
      setLeaderboardScore: function () { return asyncResolve(); },
      getLeaderboardEntries: function () { return asyncResolve({ entries: [] }); }
    };
    window.leaderboard = mockLeaderboard;

    const mockYsdk = {
      environment: { i18n: { lang: "en" } },
      deviceInfo: {
        isDesktop: function () { return true; },
        isMobile: function () { return false; },
        isTablet: function () { return false; },

      },
      clipboard: {

      serverTime: function () { return Date.now(); },
      getPlayer: function () { return asyncResolve(mockPlayer); },
      getPayments: function () { return asyncResolve(mockPayments); },
      getFlags: function () {
        return asyncResolve({
          vip_gifts_enabled: "false",
          promo_enabled: "false",
          multiplayer_enabled: "false",
          multiplayer_auto_enable: "false",
          first_open_game_tutorial_index: "0",

          open_game_gift_hands_id: "-1",

          fix: "false",
          fix2: "false",
          blocklist_ids: "-",
          active_special_promocodes: "0",
          premiumPacksState: "2",
          multiplayerDailyRewardsMultiplier: "1"
        });
      },
      getLeaderboards: function () { return asyncResolve(mockLeaderboard); },
      adv: {
        showFullscreenAdv: function (opts) { if (opts && opts.callbacks && opts.callbacks.onClose) setTimeout(function () { opts.callbacks.onClose(true); }, 0); },
        showRewardedVideo: function (opts) { if (opts && opts.callbacks && opts.callbacks.onRewarded) setTimeout(function () { opts.callbacks.onRewarded(); }, 0); if (opts && opts.callbacks && opts.callbacks.onClose) setTimeout(function () { opts.callbacks.onClose(); }, 0); },
        showBannerAdv: function () { return asyncResolve({ stickyAdvIsShowing: false }); },
        hideBannerAdv: function () { return asyncResolve({ stickyAdvIsShowing: false }); },
        getBannerAdvStatus: function () { return asyncResolve({ stickyAdvIsShowing: false }); }
      },
      shortcut: {
        canShowPrompt: function () { return asyncResolve({ canShow: false }); },
        showPrompt: function () { return asyncResolve({ outcome: "accepted" }); }
      },
      feedback: {
        canReview: function () { return asyncResolve({ value: false }); },
        requestReview: function () { return asyncResolve({ feedbackSent: true }); }
      }
    };

    window.ysdk = mockYsdk;
    window.ym = window.ym || function () { };
    window.YaGames = {

<body>
  <div id="athyx-loading-screen">

  <script>
    (function () {
      var progress = 0;
      var iv = setInterval(function () {
        progress += (50 - progress) * 0.1;
        var bar = document.getElementById("athyx-bar-inner");
        if (bar) bar.style.width = progress + "%";
      }, 200);
      window.__athyxDismissLoader = function (finalProgress) {
        clearInterval(iv);
        var bar = document.getElementById("athyx-bar-inner");
        if (bar) bar.style.width = (finalProgress || 100) + "%";
        setTimeout(function () {
          var screen = document.getElementById("athyx-loading-screen");
          if (screen) {
            screen.classList.add("fade-out");
            setTimeout(function () { screen.remove(); }, 550);
          }
        }, 300);
      };
    })();
  </script>

  <script id="base">
    var myGameInstance = null;
    var leaderboard = mockLeaderboard;
    var player = mockPlayer;
    var isDeletedGarbage = false;
    var ysdk = mockYsdk;
    var isYsdkInitialize = true;

    function initYsdk() {
      console.log('Yandex SDK start initialization');
      return YaGames.init().then(y => {
        console.log('Yandex SDK initialized');
        ysdk = y;
        return y;
      })
        .catch(console.error);
    }

    function initLeaderboard() {
      if (ysdk) {
        ysdk.getLeaderboards().then(_lb => leaderboard = _lb);
      }
    }

    function initPlayer() {
      if (ysdk === null) {
        return initYsdk().then(y => {
          return y.getPlayer().then(_player => {
            window.player = _player;
            player = _player;
            return _player;
          });
        });
      } else {
        return ysdk.getPlayer().then(_player => {
          window.player = _player;
          player = _player;
          return _player;
        });
      }
    }

    function checkCanShowShorcutDialog() {
      initYsdk().then(y => {
        y.shortcut.canShowPrompt().then(prompt => {
          if (prompt.canShow && myGameInstance) {
            myGameInstance.SendMessage("Yandex WebGL", "ShortcutDialogCanShow");
          }
        });
      });
    }

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var warningBanner = document.querySelector("#unity-warning");

    function isMobileLike() {
      if (navigator.userAgentData && 'mobile' in navigator.userAgentData) {
        return navigator.userAgentData.mobile;
      }
      if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
        return true;
      }
      const ua = navigator.userAgent || '';
      if (/Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(ua)) return true;
      const shortSide = Math.min(screen.width, screen.height);
      return shortSide <= 820;
    }

    const nativeDPR = window.devicePixelRatio || 1;
    const mobileDPR = Math.min(0.85 * nativeDPR, nativeDPR);
    const desktopDPR = Math.min(1 * nativeDPR, nativeDPR);

    const dpr = isMobileLike() ? mobileDPR : desktopDPR;

    const originalFetch = window.fetch;
    window.fetch = async function(url, options) {
      if (typeof url === 'string') {
        let isData = url.endsWith('/2a15de349ac013cf02a58d5a0f3356b7.data');
        let isWasm = url.endsWith('/eaafa628ad4d4f6425b2eca2c950924c.wasm');
        
        if (isData || isWasm) {
          const numParts = isData ? 2 : 3;
          console.log('Intercepted fetch for large file:', url, 'fetching', numParts, 'parts...');
          
          let promises = [];
          for (let i = 0; i < numParts; i++) {
            promises.push(originalFetch(`${url}.part${i}`).then(r => r.arrayBuffer()));
          }
          
          try {
            const buffers = await Promise.all(promises);
            let totalLength = buffers.reduce((acc, b) => acc + b.byteLength, 0);
            let combined = new Uint8Array(totalLength);
            let offset = 0;
            for (let b of buffers) {
              combined.set(new Uint8Array(b), offset);
              offset += b.byteLength;
            }
            console.log('Successfully reassembled:', url);
            
            return new Response(combined.buffer, {
              status: 200,
              headers: {
                'Content-Type': isWasm ? 'application/wasm' : 'application/octet-stream'
              }
            });
          } catch (e) {
            console.error('Error fetching parts:', e);
            return originalFetch(url, options);
          }
        }
      }
      return originalFetch(url, options);
    };

    var buildUrl = "https://cdn.jsdelivr.net/gh/athyx-network/athyx-game-lib@main/Surf%20Go/Build";
    var loaderUrl = buildUrl + "/db24fe51046f2eae7e7bdc07606e55d1.loader.js";

    var config = {
      dataUrl: buildUrl + "/2a15de349ac013cf02a58d5a0f3356b7.data",
      frameworkUrl: buildUrl + "/d9269ac45cb8d5de2795a664bf29db3a.framework.js",
      codeUrl: buildUrl + "/eaafa628ad4d4f6425b2eca2c950924c.wasm",
      streamingAssetsUrl: 'StreamingAssets',
      companyName: "Kot Games",
      productName: "Surf GO",
      productVersion: "3.506",
      devicePixelRatio: dpr
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      container.className = "unity-mobile";
      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    canvas.style.background = "center / cover";
    loadingBar.style.display = "block";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        myGameInstance = unityInstance;
        if (window.__athyxDismissLoader) window.__athyxDismissLoader(100);

        myGameInstance.SendMessage("Yandex WebGL", "InitializeYandexInstance");

        if (isDeletedGarbage === false) {
          const anim = document.getElementById("cuboid_anim");
          if (anim) anim.remove();
          const bar = document.getElementById("unity-loading-bar");
          if (bar) bar.remove();
          isDeletedGarbage = true;
        }
      }).catch(error => {
        console.error("Unity Instance Error:", error);
        if (isDeletedGarbage === false) {
          const anim = document.getElementById("cuboid_anim");
          if (anim) anim.remove();
          loadingBar.style.display = "none";
          isDeletedGarbage = true;
        }
      });
    };
    document.body.appendChild(script);
  </script>
