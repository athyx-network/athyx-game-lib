<!-- Extracted by the Athyx-Network -->
<!-- https://github.com/athyx-network/athyx-gamelib-->

<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>Plants Vs Zombies</title>
	<script src="jszip.min.js"></script>
	<link href="fonts/pixelify.css" rel="stylesheet" />
	<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			max-width: 100%;
			overflow: hidden;
			font-family: "Pixelify Sans", system-ui, sans-serif;
			background: #000;
		}

		#canvas-container {
			display: none;
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			justify-content: center;
			align-items: center;
			background: #000;
			overflow: hidden;
			z-index: 50;
		}

		canvas#canvas {
			display: block;
			background: #000;
			outline: 0;
			max-width: 100%;
			max-height: 100%;
		}

		#loading-credit {
			margin-top: 14px;
			color: #fff;
			font-family: "Pixelify Sans", system-ui, sans-serif;
			font-size: 13px;
			letter-spacing: 0.04em;
		}

		#pvz-soft-keyboard {
			position: fixed;
			top: 0;
			left: 0;
			width: 1px;
			height: 1px;
			padding: 0;
			border: 0;
			opacity: 0;
			resize: none;
			pointer-events: none;
			font-size: 16px;
		}
	</style>
</head>

<body>
	<div id="initial-loading-screen"
		style="position: fixed; inset: 0; width: 100%; height: 100%; background: black; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
		<img src="logo.png" alt="Loading Logo" style="max-width: 40%; max-height: 40%;" />
		<div
			style="width: 300px; height: 12px; background: #222; border-radius: 6px; margin-top: 30px; overflow: hidden; border: 1px solid #444; box-shadow: 0 0 10px rgba(255,255,255,0.2);">
			<div id="loading-bar-inner" style="width: 0%; height: 100%; background: #fff; transition: width 0.3s ease;">
			</div>
		</div>
		<p id="loading-credit">Ported by Athyx Network</p>
		<script>
			window.loadingProgress = 0;
			window.loadingInterval = setInterval(() => {
				window.loadingProgress += (50 - window.loadingProgress) * 0.1;
				const bar = document.getElementById("loading-bar-inner");
				if (bar) bar.style.width = window.loadingProgress + "%";
			}, 200);
		</script>
	</div>

	<!-- Required by pvz-ui.js — kept hidden -->
	<div aria-hidden="true" style="display:none">
		<div id="upload-screen"></div>
		<p id="loading-drop-zone"></p>
		<div id="drop-zone"></div>
		<div id="file-list"></div>
		<input id="file-input" type="file" multiple webkitdirectory />
		<input id="resource-zip-input" type="file" accept=".zip,application/zip,application/x-zip-compressed" />
		<button id="browse-zip-btn" type="button"></button>
		<button id="browse-folder-btn" type="button"></button>
		<a id="reselect-link" tabindex="-1"></a>
		<button id="upload-save-import-btn" type="button"></button>
		<button id="upload-save-import-dir-btn" type="button"></button>
		<button id="upload-save-clear-btn" type="button"></button>
		<button id="save-export-btn" type="button"></button>
		<input id="upload-save-import-input" type="file" accept=".zip" />
		<input id="upload-save-import-dir-input" type="file" multiple webkitdirectory />
	</div>

	<div id="canvas-container">
		<canvas id="canvas" width="800" height="600" tabindex="0"></canvas>
	</div>

	<textarea id="pvz-soft-keyboard" autocapitalize="off" autocomplete="off" autocorrect="off" enterkeyhint="done"
		spellcheck="false"></textarea>

	<script>
		window.moduleReadyPromise = new Promise(function (resolve, reject) {
			window._resolveModuleReady = resolve;
			window._rejectModuleReady = reject;
		});
		var Module = {
			canvas: document.getElementById("canvas"),
			noInitialRun: true,
			onRuntimeInitialized: function () { window._resolveModuleReady(); },
			onAbort: function (msg) { window._rejectModuleReady(new Error(msg)); },
			print: function (msg) { console.log(msg); },
			printErr: function (msg) { console.warn(msg); },
		};
	</script>
	<script defer src="pvz-portable.js"></script>
	<script defer src="pvz-ui.js"></script>
	<script defer src="pvz-mobile-gamepad.js"></script>
</body>

</html>
