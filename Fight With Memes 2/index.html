<!DOCTYPE html>

<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Бой с Мемами 2</title>
<link rel="shortcut icon" href="TemplateData/favicon.ico"/>
<link rel="stylesheet" href="TemplateData/style.css"/>

</head>
<body class="dark">
<div id="game-shell">
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas" width="1920" height="1080"></canvas>
<div id="loading-cover" style="display:none;">
<div id="unity-loading-bar">
<div id="unity-logo"><img src="logo.png" alt="logo"/></div>
<div id="unity-progress-bar-empty" style="display:none;">
<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner"></div>
</div>
</div>
<div id="unity-fullscreen-button" style="display:none;"></div>
</div>
</div>
<script>
    const GAME_WIDTH = 1280;
    const GAME_HEIGHT = 720;

    const hideFullScreenButton = "1";
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/a554a9114102c63f0ee62f6ea0bae7e3.loader.js";

    const config = {
      dataUrl: buildUrl + "/ffed539b9481bec349ebd1c66113950e.data.unityweb",
      frameworkUrl: buildUrl + "/89e0db44a593c1a444a37415a410a8d2.framework.js.unityweb",
      codeUrl: buildUrl + "/9b905dac73c4d0d0dc17414e5560c767.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "alxd",
      productName: "Бой с Мемами 2",
      productVersion: "0.0.2.1",

      // Ключевой параметр: Unity не будет подгонять render size под CSS-размер canvas
      matchWebGLToCanvasSize: false
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const fullscreenButton = document.querySelector("#unity-fullscreen-button");
    const spinner = document.querySelector(".spinner");

    canvas.width = GAME_WIDTH;
    canvas.height = GAME_HEIGHT;

    function lockBrowserScrolling() {
      const preventDefault = (e) => {
        if (e.cancelable) {
          e.preventDefault();
        }
      };

      // Страховка от прокрутки страницы
      document.documentElement.style.overflow = "hidden";
      document.body.style.overflow = "hidden";

      // Самые важные перехваты
      document.addEventListener("touchmove", preventDefault, { passive: false });
      document.addEventListener("wheel", preventDefault, { passive: false });
      document.addEventListener("gesturestart", preventDefault, { passive: false });
      document.addEventListener("gesturechange", preventDefault, { passive: false });

      // Если браузер всё же пытается сдвинуть страницу
      const snapToTop = () => window.scrollTo(0, 0);

      window.addEventListener("scroll", snapToTop, { passive: true });
      window.addEventListener("resize", snapToTop, { passive: true });
      window.addEventListener("orientationchange", snapToTop, { passive: true });

      snapToTop();
    }

    lockBrowserScrolling();

    const canFullscreen = (function () {
      for (const key of [
        "exitFullscreen",
        "webkitExitFullscreen",
        "webkitCancelFullScreen",
        "mozCancelFullScreen",
        "msExitFullscreen"
      ]) {
        if (key in document) {
          return true;
        }
      }
      return false;
    }());

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }


    loadingCover.style.display = "";

    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        loadingCover.style.display = "none";

        if (canFullscreen) {
          if (!hideFullScreenButton) {
            fullscreenButton.style.display = "";
          }

          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
